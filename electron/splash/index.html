<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'none'"
    />
    <title>T.A.I.L.S.</title>
    <style>
      /* Deliberately matches the app's dark `--background` (240 10% 6%) so the
         handoff from this window to the first React frame is invisible. If the
         app's default ramp changes, change this with it. */
      :root {
        --bg: hsl(240 10% 6%);
        --fg: hsl(40 15% 95%);
        --muted: hsl(240 5% 65%);
        --accent: hsl(221 83% 62%);
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        -webkit-user-select: none;
        user-select: none;
      }

      .stage {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        border-radius: 14px;
      }

      .bloom {
        position: absolute;
        width: 26rem;
        height: 26rem;
        border-radius: 50%;
        background: radial-gradient(circle, hsl(221 83% 62% / 0.32), transparent 70%);
        filter: blur(48px);
        animation: breathe 3.2s ease-in-out infinite;
      }

      .wordmark {
        position: relative;
        display: flex;
        font-size: 2.75rem;
        font-weight: 900;
        letter-spacing: 0.2em;
      }

      /* Letters assemble one at a time — the wordmark builds itself rather
         than simply appearing. */
      .wordmark span {
        opacity: 0;
        transform: translateY(10px);
        animation: rise 520ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }

      .dot { color: var(--accent); opacity: 0.5; }

      .caption {
        position: relative;
        margin-top: 1.15rem;
        font-size: 0.8125rem;
        color: var(--muted);
        opacity: 0;
        animation: rise 420ms cubic-bezier(0.22, 1, 0.36, 1) 900ms forwards;
      }

      @keyframes rise {
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes breathe {
        0%, 100% { opacity: 0.55; transform: scale(1); }
        50% { opacity: 0.85; transform: scale(1.06); }
      }

      @media (prefers-reduced-motion: reduce) {
        .wordmark span, .caption { animation: none; opacity: 1; transform: none; }
        .bloom { animation: none; }
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="bloom"></div>
      <div class="wordmark">
        <span style="animation-delay: 0ms">T<span class="dot">.</span></span>
        <span style="animation-delay: 90ms">A<span class="dot">.</span></span>
        <span style="animation-delay: 180ms">I<span class="dot">.</span></span>
        <span style="animation-delay: 270ms">L<span class="dot">.</span></span>
        <span style="animation-delay: 360ms">S<span class="dot">.</span></span>
      </div>
      <p class="caption">The Actually Intelligent Little Sidekick</p>
    </div>
  </body>
</html>
